resend.api.key=${RESEND_API_KEY}

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =========================================================
# GEMINI
# =========================================================

gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}